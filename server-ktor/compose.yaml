services:
  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE in .env}
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
    mem_limit: 320m

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      SERVER_HOST: ${SERVER_HOST:-pvlbndrnk.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
