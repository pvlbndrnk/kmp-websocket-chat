schemaVersion: '2.2'
description: Deploy a published Ktor chat server image

parameters:
  ImageDigest:
    type: String
    description: Digest of the published server image
    interpolationType: ENV_VAR
    allowedPattern: '^sha256:[0-9a-f]{64}$'

mainSteps:
  - action: aws:runShellScript
    name: deployServer
    inputs:
      timeoutSeconds: '300'
      runCommand:
        - |
          set -eu

          exec 9>/run/lock/ktor-chat-deploy.lock
          flock -n 9 || { echo 'A deployment is already running'; exit 1; }

          cd /home/ubuntu/ktor-chat
          test -f .env
          test "$(grep -c '^SERVER_IMAGE=' .env)" -eq 1

          image="ghcr.io/pvlbndrnk/kmp-websocket-chat-server@${SSM_ImageDigest}"
          previous_image="$(sed -n 's/^SERVER_IMAGE=//p' .env)"

          docker pull "$image"

          restore_previous() {
            sed -i "s|^SERVER_IMAGE=.*|SERVER_IMAGE=${previous_image}|" .env
            docker compose up -d --no-deps --force-recreate server
          }

          sed -i "s|^SERVER_IMAGE=.*|SERVER_IMAGE=${image}|" .env

          if ! docker compose config --quiet ||
             ! docker compose up -d --no-deps --force-recreate server; then
            echo 'Deployment failed; restoring the previous image'
            restore_previous
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if curl -fsS -o /dev/null --max-time 5 --noproxy '*' \
              --resolve pvlbndrnk.duckdns.org:443:127.0.0.1 \
              https://pvlbndrnk.duckdns.org/messages; then
              echo 'Deployment succeeded'
              exit 0
            fi
            sleep 3
          done

          echo 'Server did not respond; restoring the previous image'
          restore_previous
          exit 1
