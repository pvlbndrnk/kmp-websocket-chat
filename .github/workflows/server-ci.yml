name: Server CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/spring-server-bootstrap]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Ktor Server
        run: ./gradlew :server-ktor:buildFatJar

      - name: Upload Ktor Server Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: server-ktor-jar
          path: server-ktor/build/libs/server-ktor-all.jar
          if-no-files-found: error
          retention-days: 1

      - name: Build Spring Server
        run: ./gradlew :server-spring:bootJar

      - name: Upload Spring Server Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: server-spring-jar
          path: server-spring/build/libs/server-spring.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Ktor Server Artifact
        uses: actions/download-artifact@v7
        with:
          name: server-ktor-jar
          path: server-ktor/build/libs

      - name: Download Spring Server Artifact
        uses: actions/download-artifact@v7
        with:
          name: server-spring-jar
          path: server-spring/build/libs

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Publish Ktor Server Image
        id: ktor_image
        uses: docker/build-push-action@v7
        with:
          context: ./server-ktor
          file: ./server-ktor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pvlbndrnk/kmp-websocket-chat-server-ktor:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & Publish Spring Server Image
        id: spring_image
        uses: docker/build-push-action@v7
        with:
          context: ./server-spring
          file: ./server-spring/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pvlbndrnk/kmp-websocket-chat-server-spring:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Show published digests
        env:
          KTOR_DIGEST: ${{ steps.ktor_image.outputs.digest }}
          SPRING_DIGEST: ${{ steps.spring_image.outputs.digest }}
        run: |
          echo "Ktor: $KTOR_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Spring: $SPRING_DIGEST" >> "$GITHUB_STEP_SUMMARY"
