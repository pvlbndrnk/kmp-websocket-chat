name: Server CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Server
        run: ./gradlew :server-ktor:buildFatJar

      - name: Upload Server Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: server-ktor/build/libs/server-ktor-all.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Server Artifact
        uses: actions/download-artifact@v7
        with:
          name: server-jar
          path: server-ktor/build/libs

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Publish Server Image
        uses: docker/build-push-action@v7
        with:
          context: ./server-ktor
          file: ./server-ktor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pvlbndrnk/kmp-websocket-chat-server:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}