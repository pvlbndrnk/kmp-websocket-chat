name: Server CD

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check_aws_access:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::967228661530:role/ktor-chat-github-deploy
          aws-region: eu-north-1

      - name: Show AWS Identity
        run: aws sts get-caller-identity --query Arn --output text
