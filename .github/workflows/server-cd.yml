name: Deploy Server

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Server implementation'
        required: true
        type: choice
        options:
          - ktor
          - spring
      image_digest:
        description: 'Digest of the selected server image (sha256:...)'
        required: true
        type: string

permissions:
  id-token: write

concurrency:
  group: server-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::967228661530:role/server-github-deploy
          aws-region: eu-north-1

      - name: Show AWS Identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Send deployment command
        id: send
        env:
          SERVER_KIND: ${{ inputs.server }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          [[ "$SERVER_KIND" == ktor || "$SERVER_KIND" == spring ]] || {
            echo 'Expected ktor or spring'
            exit 1
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Expected a sha256 image digest'
            exit 1
          }

          command_id=$(aws ssm send-command --document-name Server-Deploy --document-version '$DEFAULT' --instance-ids i-01d3a5f2c943132dd --parameters "ServerKind=$SERVER_KIND,ImageDigest=$IMAGE_DIGEST" --query 'Command.CommandId' --output text)

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $command_id"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          for attempt in {1..90}; do
            if status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-01d3a5f2c943132dd --query Status --output text 2>&1); then
              case "$status" in
                Success)
                  echo "Deployment succeeded; SSM command: $COMMAND_ID"
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut)
                  aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-01d3a5f2c943132dd --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
                  exit 1
                  ;;
                Pending|InProgress|Delayed|Cancelling)
                  sleep 5
                  ;;
                *)
                  echo "Unexpected SSM status: $status"
                  exit 1
                  ;;
              esac
            elif [[ "$status" == *InvocationDoesNotExist* ]]; then
                sleep 5
            else
              echo "$status"
              exit 1
            fi
          done

          echo "Timed out waiting for SSM command: $COMMAND_ID"
          exit 1
